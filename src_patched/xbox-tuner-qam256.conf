# Optimizari USB / DiB0700 si Demodulator MN88472 pentru Xbox One Digital TV Tuner (045e:02d5)
# Rezolva pierderile de pachete (Continuity Counter Errors) pe DVB-C QAM-256 cu bitrate mare (~50.87 Mbps, ex: DIGI)
options dvb_usb_dib0700 nb_packet_buffer_size=512 disable_rc_polling=1
options mn88472 stat_poll_interval=0 force_variable_ts_clock=1 dvbc_d6_val=70
